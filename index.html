<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #06080a;
  --panel:  #0d1014;
  --border: #1c2228;
  --text:   #b0bec8;
  --dim:    #3a4a56;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { min-height: 100%; }

body {
  background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 48px 20px;
  gap: 52px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
}

/* scanlines */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
}

header {
  text-align: center;
  z-index: 1;
}

.site-title {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(32px, 7vw, 52px);
  letter-spacing: 0.35em;
  color: #fff;
  line-height: 1;
  text-shadow: 0 0 40px rgba(255,255,255,0.12);
}

.site-sub {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--dim);
}

.grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 1;
}

.card {
  width: 210px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 30px 22px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: transform 0.18s ease, border-color 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 100% 60% at 50% -10%, var(--accent), transparent 70%);
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-6px);
  border-color: var(--accent);
  box-shadow:
    0 0 0 1px var(--accent-dim),
    0 0 40px var(--accent-glow),
    0 20px 48px rgba(0,0,0,0.6);
}

.card:hover::after { opacity: 0.09; }

.icon {
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

.game-name {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 0.22em;
  color: var(--accent);
  text-align: center;
  z-index: 1;
}

.game-desc {
  font-size: 10px;
  color: var(--dim);
  text-align: center;
  line-height: 2;
  letter-spacing: 0.05em;
  z-index: 1;
}

.play-btn {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.25em;
  color: var(--bg);
  background: var(--accent);
  padding: 9px 28px;
  border-radius: 100px;
  z-index: 1;
  box-shadow: 0 0 18px var(--accent-glow);
  transition: box-shadow 0.18s, transform 0.12s;
}

.card:hover .play-btn {
  box-shadow: 0 0 32px var(--accent-glow);
  transform: scale(1.06);
}

footer {
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--dim);
  text-transform: uppercase;
  z-index: 1;
  opacity: 0.6;
}
</style>
</head>
<body>

<header>
  <div class="site-title">ARCADE</div>
  <div class="site-sub">choose your game</div>
</header>

<div class="grid">

  <!-- ── HEXFALL ─────────────────────────────────── -->
  <a class="card" href="hexfall/hexfall.html"
     style="--accent:#f5a623;--accent-dim:rgba(245,166,35,0.25);--accent-glow:rgba(245,166,35,0.35)">
    <svg class="icon" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow-a" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- grid hexes (dim, bottom rows) -->
      <polygon points="22,52 31,47 40,52 40,62 31,67 22,62" fill="rgba(245,166,35,0.06)" stroke="rgba(245,166,35,0.2)" stroke-width="1.2"/>
      <polygon points="36,52 45,47 54,52 54,62 45,67 36,62" fill="rgba(245,166,35,0.06)" stroke="rgba(245,166,35,0.2)" stroke-width="1.2"/>
      <polygon points="8,52 17,47 26,52 26,62 17,67 8,62"  fill="rgba(245,166,35,0.06)" stroke="rgba(245,166,35,0.2)" stroke-width="1.2"/>
      <!-- landing ghost -->
      <polygon points="22,33 31,28 40,33 40,43 31,48 22,43" fill="rgba(245,166,35,0.08)" stroke="rgba(245,166,35,0.25)" stroke-width="1" stroke-dasharray="3 2"/>
      <!-- falling hex (bright, with glow) -->
      <polygon filter="url(#glow-a)" points="22,14 31,9 40,14 40,24 31,29 22,24"
               fill="rgba(245,166,35,0.7)" stroke="#f5a623" stroke-width="1.8"/>
      <!-- shine -->
      <polygon points="24,14 31,10 38,14 38,19 31,16 24,19" fill="rgba(255,255,255,0.18)"/>
      <!-- drop trail -->
      <line x1="31" y1="29" x2="31" y2="33" stroke="#f5a623" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
    </svg>
    <div class="game-name">HEXFALL</div>
    <div class="game-desc">Drop hexes into the grid<br>match 4+ to blast</div>
    <div class="play-btn">PLAY</div>
  </a>

  <!-- ── NEON DROP ────────────────────────────────── -->
  <a class="card" href="neon-drop/index.html"
     style="--accent:#00f5ff;--accent-dim:rgba(0,245,255,0.22);--accent-glow:rgba(0,245,255,0.32)">
    <svg class="icon" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow-c" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- container -->
      <path d="M14 36 L14 68 L62 68 L62 36" stroke="#00f5ff" stroke-width="1.5" fill="rgba(0,245,255,0.04)" stroke-linejoin="round"/>
      <!-- stacked orbs inside -->
      <circle cx="38" cy="57" r="8"  fill="rgba(0,245,255,0.25)"  stroke="#00f5ff"  stroke-width="1.4"/>
      <circle cx="26" cy="50" r="7"  fill="rgba(255,0,144,0.25)"  stroke="#ff0090"  stroke-width="1.4"/>
      <circle cx="50" cy="51" r="7"  fill="rgba(255,242,0,0.25)"  stroke="#fff200"  stroke-width="1.4"/>
      <!-- falling orb -->
      <circle filter="url(#glow-c)" cx="38" cy="14" r="6" fill="rgba(0,245,255,0.65)" stroke="#00f5ff" stroke-width="1.8"/>
      <circle cx="36" cy="12" r="2" fill="rgba(255,255,255,0.35)"/>
      <!-- dashed drop line -->
      <line x1="38" y1="21" x2="38" y2="34" stroke="#00f5ff" stroke-width="1" stroke-dasharray="2 3" opacity="0.45"/>
    </svg>
    <div class="game-name">NEON DROP</div>
    <div class="game-desc">Physics ball drop<br>stack &amp; merge orbs</div>
    <div class="play-btn">PLAY</div>
  </a>

  <!-- ── SNAKE ────────────────────────────────────── -->
  <a class="card" href="snake/snake.html"
     style="--accent:#00ff41;--accent-dim:rgba(0,255,65,0.22);--accent-glow:rgba(0,255,65,0.28)">
    <svg class="icon" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow-g" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- snake segments — tail to head, brightening -->
      <rect x="10" y="44" width="13" height="13" rx="3" fill="rgba(0,255,65,0.12)" stroke="rgba(0,255,65,0.35)" stroke-width="1.2"/>
      <rect x="10" y="30" width="13" height="13" rx="3" fill="rgba(0,255,65,0.2)"  stroke="rgba(0,255,65,0.5)"  stroke-width="1.2"/>
      <rect x="24" y="30" width="13" height="13" rx="3" fill="rgba(0,255,65,0.32)" stroke="rgba(0,255,65,0.65)" stroke-width="1.3"/>
      <rect x="38" y="30" width="13" height="13" rx="3" fill="rgba(0,255,65,0.46)" stroke="#00ff41" stroke-width="1.4"/>
      <rect x="38" y="16" width="13" height="13" rx="3" fill="rgba(0,255,65,0.65)" stroke="#00ff41" stroke-width="1.5"/>
      <!-- head -->
      <rect filter="url(#glow-g)" x="52" y="16" width="13" height="13" rx="3"
            fill="rgba(0,255,65,0.8)" stroke="#00ff41" stroke-width="1.8"/>
      <!-- eyes -->
      <circle cx="57" cy="20" r="1.5" fill="#050a05"/>
      <circle cx="62" cy="20" r="1.5" fill="#050a05"/>
      <!-- food (apple/orb) -->
      <circle cx="18" cy="60" r="6" fill="rgba(255,60,60,0.75)" stroke="#ff3c3c" stroke-width="1.4"/>
      <circle cx="16" cy="57" r="1.8" fill="rgba(255,255,255,0.3)"/>
    </svg>
    <div class="game-name">SNAKE</div>
    <div class="game-desc">Classic arcade snake<br>eat · grow · survive</div>
    <div class="play-btn">PLAY</div>
  </a>

</div>

<footer>Luis's arcade &nbsp;·&nbsp; 2025</footer>

</body>
</html>
